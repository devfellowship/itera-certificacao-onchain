name: web3 e2e guard

# Hermetic end-to-end guard of the hackathon web3 flow (plan 20261015-testmyagent-web2-client, T14):
#   SIWS login -> quote -> Solana Pay payment -> run (real runner + grader) -> SAS attestation -> verify
# against the code of THIS commit, never the deployed app. The job builds its own stack:
#   - Postgres with db/migrations/*.sql, plus scripts/e2e/hermetic/db-seed.sql (one agent fixture);
#   - solana-test-validator with the SAS program cloned from devnet and the TestMyAgent Credential,
#     Schema and schema mint loaded at their real addresses (the job's hot signer is an added signer);
#   - the API (apps/api) and the runner worker (services/runner) from source;
#   - scripts/e2e/hermetic/stubs.mjs for the model (deterministic: it applies the reference patch),
#     the SOL/USD price, Pinata and the IPFS gateway.
# Every key is generated in the job. No repository secret and no paid key is used.
# Two jobs on the same stack (./.github/actions/web3-hermetic-stack and web3-hermetic-services):
#   - web3-e2e:          the API flow (scripts/e2e/api-e2e.mts).
#   - web3-browser-e2e:  the web3 UI (apps/web of this commit) in a real Chrome, with a throwaway test wallet
#                        injected into the page (scripts/e2e/browser-hermetic.mts): SIWS, quote, pay with one
#                        signature, the evaluation to issued, the score on /e/:slug, Verify -> VERIFIED.
# Not covered here: the GitHub App routes (no App credential in CI; the agent is a DB fixture) and
# the web host link previews (OG meta).
#
# Path filter: in the `changes` job, not in `on.pull_request.paths`. A PR outside the paths gets the two
# e2e jobs as "skipped", which a required status check accepts. A workflow that a `paths:` filter does
# not start never reports, and a required check then waits forever.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web3-e2e-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  AGAVE_VERSION: v4.2.2
  # The run's model gateway container reaches the stub through the Docker bridge gateway.
  STUB_PORT: '18080'
  API_PORT: '3000'
  E2E_DIR: ${{ github.workspace }}/.e2e
  DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  DATABASE_URL: postgresql://itera_api_service:e2e-local-only@127.0.0.1:5432/postgres

jobs:
  changes:
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Paths of the web3 flow
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: run"; exit 0
          fi
          # The PR checkout is the merge commit: HEAD^1 is the base branch tip.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          re='^(apps/api/|apps/web/|services/|packages/|db/migrations/|mcp/|benchmarks/|graders/|scripts/e2e/|\.github/workflows/web3-e2e-guard\.yml$|\.github/actions/web3-hermetic-|package\.json$|package-lock\.json$)'
          if echo "$changed" | grep -Eq "$re"; then echo "relevant=true" >> "$GITHUB_OUTPUT"; else echo "relevant=false" >> "$GITHUB_OUTPUT"; echo "no web3 path changed: the e2e jobs skip"; fi

  web3-e2e:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web3-hermetic-stack

      # T7 (free BYOK path): the pg store against the migrated schema — one transaction for the
      # evaluation and its runs, the abuse floor, `graded`, and the 0019 CHECKs. It runs BEFORE the
      # worker starts and deletes its own fixtures, so the worker never claims its queued runs.
      - name: Evaluations store contract test (Postgres)
        working-directory: apps/api
        run: npx vitest run src/evaluations/store.contract.test.ts
        env:
          ITERA_PG_TEST_URL: ${{ env.DATABASE_URL_ADMIN }}

      # L2 (plan 20261026-tma-local-runner-and-self-declared-results): 0021 applies a second time with
      # no error, the bench-import relabel is idempotent, and its CHECKs refuse the forbidden shapes.
      # It deletes its own fixtures before the worker starts.
      - name: Migration 0021 test (Postgres)
        working-directory: apps/api
        run: npx vitest run src/domain/migration-0021.pg.test.ts
        env:
          ITERA_PG_TEST_URL: ${{ env.DATABASE_URL_ADMIN }}

      - name: Self-declared results store test (Postgres)
        working-directory: apps/api
        run: npx vitest run src/self-declared/store.pg.test.ts
        env:
          ITERA_PG_TEST_URL: ${{ env.DATABASE_URL_ADMIN }}

      - name: Local agents and custom models store test (Postgres)
        working-directory: apps/api
        run: npx vitest run src/local-agents/store.pg.test.ts
        env:
          ITERA_PG_TEST_URL: ${{ env.DATABASE_URL_ADMIN }}

      - uses: ./.github/actions/web3-hermetic-services

      - name: 'API e2e: SIWS -> quote -> pay -> run -> attestation -> verify'
        run: |
          npx tsx scripts/e2e/api-e2e.mts \
            --base "http://127.0.0.1:$API_PORT" --rpc http://127.0.0.1:8899 \
            --agent-id "$E2E_AGENT_ID" --task tsk_webhook_dup --treasury "$TREASURY_ADDRESS" \
            --no-web --ipfs-gateway "http://127.0.0.1:$STUB_PORT/ipfs" --verify-strict \
            --poll-timeout-min 15 --out e2e-report

      - name: Summary
        if: always()
        run: |
          {
            echo "## web3 e2e guard (hermetic, this commit)"
            echo
            echo "Covered: SIWS, catalog, quote (stub SOL/USD), Solana Pay payment and validation on a local validator,"
            echo "the real runner and grader (stub model that applies the reference patch), IPFS pin (stub),"
            echo "the SAS tokenized attestation, and apps/web/src/verify.ts on the minted NFT."
            echo
            echo "**Not covered here:** the GitHub App routes (no App credential in CI: the agent is a DB fixture)"
            echo "and the web host (link preview, badge redirect). The browser e2e runs in the job web3-browser-e2e."
            echo
            if [ -f e2e-report/api-e2e.md ]; then cat e2e-report/api-e2e.md; else echo "No e2e report: the job failed before the driver ran."; fi
            echo
            echo "### Stub counters"
            echo '```'
            curl -s "http://127.0.0.1:$STUB_PORT/health" || echo "stub not reachable"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p e2e-report/logs
          cp "$E2E_DIR"/*.log e2e-report/logs/ 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > e2e-report/logs/docker-ps.txt || true

      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web3-e2e-report
          path: e2e-report/
          if-no-files-found: warn
          retention-days: 3

  web3-browser-e2e:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_PORT: '4173'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web3-hermetic-stack
      - uses: ./.github/actions/web3-hermetic-services
        with:
          cors-origins: http://127.0.0.1:4173

      # apps/web as production builds it (tsc + vite build) and serves it (server.mjs). Only the API
      # origin is a build input; the devnet RPC and the IPFS gateway are fixed in the app and the
      # driver routes them to the job's validator and IPFS stub.
      - name: Build and serve the web app (apps/web, this commit)
        run: |
          set -euo pipefail
          VITE_API_BASE_URL="http://127.0.0.1:$API_PORT" npm run build -w @itera/web
          PORT="$WEB_PORT" API_BASE_URL="http://127.0.0.1:$API_PORT" nohup node apps/web/server.mjs > "$E2E_DIR/web.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$WEB_PORT/health" >/dev/null && break; sleep 1; done
          curl -sf "http://127.0.0.1:$WEB_PORT/health"

      - name: Browser (Chrome on the runner, else Playwright Chromium)
        run: |
          if [ -x /usr/bin/google-chrome ]; then /usr/bin/google-chrome --version; else npx playwright install --with-deps chromium; fi

      - name: 'Browser e2e: landing -> SIWS -> quote -> pay -> issued -> score -> Verify'
        run: |
          npx tsx scripts/e2e/browser-hermetic.mts \
            --web "http://127.0.0.1:$WEB_PORT" --api "http://127.0.0.1:$API_PORT" \
            --rpc http://127.0.0.1:8899 --rpc-ws ws://127.0.0.1:8900 \
            --ipfs-gateway "http://127.0.0.1:$STUB_PORT/ipfs" \
            --agent-id "$E2E_AGENT_ID" --task tsk_webhook_dup --treasury "$TREASURY_ADDRESS" \
            --max-wait-min 15 --out e2e-report

      - name: Summary
        if: always()
        run: |
          {
            echo "## web3 browser e2e (hermetic, this commit)"
            echo
            echo "apps/web of this commit in Chrome, with a throwaway test wallet injected into the page."
            echo "Each step asserts MOUNT (#root non-empty), NO ERRORS (zero pageerror) and a positive data control."
            echo
            if [ -f e2e-report/browser-hermetic.md ]; then cat e2e-report/browser-hermetic.md; else echo "No report: the job failed before the driver ran."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p e2e-report/logs
          cp "$E2E_DIR"/*.log e2e-report/logs/ 2>/dev/null || true

      - name: Upload the browser e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web3-browser-e2e-report
          path: e2e-report/
          if-no-files-found: warn
          retention-days: 3
