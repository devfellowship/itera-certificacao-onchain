name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 scripts/check-scenarios.py
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: docker build --tag itera-agent-credentials:ci .
      - run: docker build --file apps/api/Dockerfile --tag itera-agent-credentials-api:ci .

# Deploys do not run here. The dedicated Dokploy (itera-agent-credentials-dokploy.devfellowship.com)
# receives a GitHub repo webhook on push. Each Dokploy app rebuilds only when the push touches its
# watch paths. See README "CI and deployment".
