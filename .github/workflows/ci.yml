name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-tasks.mts
      - run: npm run check
      - run: npm run test
      - run: npm run build
      # GitHub-hosted runners pull Docker Hub anonymously and hit its rate limit (429).
      # mirror.gcr.io is Google's pull-through cache of Docker Hub official images.
      - name: Use a Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'
      - run: docker build --tag itera-agent-credentials:ci .
      - run: docker build --file apps/api/Dockerfile --tag itera-agent-credentials-api:ci .
      - run: docker build --tag itera-runner-sandbox:ci services/runner/sandbox
      # ADR-9: the grader sandbox, against real Docker (escape probe 0/5, webhook-ledger 100, validation gate).
      - name: Grader sandbox integration test
        working-directory: services/runner
        run: npx vitest run src/grade.integration.test.ts
        env:
          ITERA_DOCKER_TESTS: '1'
          ITERA_SANDBOX_IMAGE: itera-runner-sandbox:ci
      - run: docker build --file services/runner/Dockerfile --tag itera-runner-worker:ci .

# Deploys do not run here. The deploy platform receives a GitHub repo webhook on push. Each app
# rebuilds only when the push touches its watch paths. See README "Deployment".

  # MCP catalog (docs/architecture/mcp-sandbox.md, registration steps 2–3): build every image under
  # mcp/catalog/, run the conformance test against real Docker, and on main publish each version to
  # GHCR by digest. A published version is immutable: the job refuses to change it.
  mcp-catalog:
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use a Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and test every catalog image
        run: |
          set -euo pipefail
          for dir in mcp/catalog/*/; do
            name=$(basename "$dir")
            docker build --quiet --tag "testmyagent-mcp-$name:ci" --file "$dir/Dockerfile" mcp
            node mcp/conformance.mjs "$name" "testmyagent-mcp-$name:ci"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # U29: sidecar lifecycle, mcp_state score and the validation-gate mcp step on the demo task,
      # against the image this job just built (benchmarks/helpdesk-refunds).
      - name: Runner MCP integration test
        working-directory: services/runner
        run: npx vitest run src/mcp.integration.test.ts
        env:
          ITERA_DOCKER_TESTS: '1'
          ITERA_MCP_HELPDESK_IMAGE: testmyagent-mcp-helpdesk:ci
      - name: Refuse to change a published version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          for dir in mcp/catalog/*/; do
            name=$(basename "$dir")
            version=$(node -p "require('./$dir/manifest.json').version")
            ref="ghcr.io/${{ github.repository_owner }}/testmyagent-mcp-$name:$version"
            changed=$(git diff --name-only "$base"...HEAD -- "$dir" mcp/base | head -1)
            if [ -n "$changed" ] && docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref is already published and this PR changes $dir or mcp/base: bump version in $dir/manifest.json"
              exit 1
            fi
            echo "$name@$version: ${changed:+changed, }not published or unchanged"
          done
      - name: Publish new versions to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for dir in mcp/catalog/*/; do
            name=$(basename "$dir")
            version=$(node -p "require('./$dir/manifest.json').version")
            ref="ghcr.io/${{ github.repository_owner }}/testmyagent-mcp-$name:$version"
            # Before 2026-10-12 the packages were itera-mcp-<name>. A version published there is
            # COPIED byte for byte (skopeo --preserve-digests), never rebuilt: the digest that tasks
            # pin stays valid. `buildx imagetools create` is NOT a copy: it wraps the manifest in a
            # new list with a new digest (it did, on b12c741), so a tag that differs is re-copied.
            legacy="ghcr.io/${{ github.repository_owner }}/itera-mcp-$name:$version"
            digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'; }
            if docker manifest inspect "$legacy" >/dev/null 2>&1; then
              want=$(digest_of "$legacy")
              if [ "$(digest_of "$ref")" != "$want" ]; then
                command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
                skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" "docker://$legacy" "docker://$ref"
                echo "$ref copied from $legacy"
              fi
              [ "$(digest_of "$ref")" = "$want" ] || { echo "::error::$ref does not serve the digest $want of $legacy"; exit 1; }
            elif docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "$ref exists: a published version never changes (skip)"
            else
              docker tag "testmyagent-mcp-$name:ci" "$ref"
              docker push --quiet "$ref"
            fi
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "$name@$version $ref@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Grading images (graders/<name>/): a task names one, pinned by digest, in task.json verifier.image
  # (services/runner/src/grade.ts graderImage). Build, self-test with the grader's isolation flags,
  # and on main publish each version to GHCR. A published version is immutable.
  grader-images:
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use a Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and self-test every grader image
        run: |
          set -euo pipefail
          for dir in graders/*/; do
            name=$(basename "$dir")
            docker build --quiet --tag "testmyagent-grader-$name:ci" "$dir"
            # Same isolation as buildGraderArgs: no network, read-only rootfs, uid 10002, no capabilities.
            docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
              --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 512 --ulimit nofile=1024:1024 \
              --cap-drop ALL --security-opt no-new-privileges --user 10002:10002 \
              "testmyagent-grader-$name:ci"
          done
      - name: Refuse to change a published version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for dir in graders/*/; do
            name=$(basename "$dir")
            version=$(grep -oP 'io\.itera\.grader\.version="\K[0-9]+' "$dir/Dockerfile")
            ref="ghcr.io/${{ github.repository_owner }}/testmyagent-grader-$name:$version"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- "$dir" | head -1)
            if [ -n "$changed" ] && docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref is already published and this PR changes $dir: bump io.itera.grader.version"
              exit 1
            fi
          done
      - name: Publish new versions to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for dir in graders/*/; do
            name=$(basename "$dir")
            version=$(grep -oP 'io\.itera\.grader\.version="\K[0-9]+' "$dir/Dockerfile")
            ref="ghcr.io/${{ github.repository_owner }}/testmyagent-grader-$name:$version"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "$ref exists: a published version never changes (skip)"
            else
              docker tag "testmyagent-grader-$name:ci" "$ref"
              docker push --quiet "$ref"
            fi
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "$name@$version $ref@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done
